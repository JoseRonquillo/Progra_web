<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ChatGPT Replica</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="container">
    <aside class="sidebar">
      <button class="new-chat">➕ New Chat</button>
      <nav class="chat-list">
        <a href="#">💬 Chat 1</a>
        <a href="#">💬 Chat 2</a>
        <a href="#">💬 Chat 3</a>
      </nav>
      <div class="sidebar-bottom">
        <button class="settings">⚙️ Settings</button>
        <button class="logout">🔒 Log out</button>
      </div>
    </aside>
    <main class="chat">
      <div class="messages">
        <div class="message user">👤 Hello, ChatGPT!</div>
        <div class="message bot">🤖 Hello! How can I assist you today?</div>
      </div>
      <form class="input-area">
        <input type="text" placeholder="Send a message..." required />
        <button type="submit">📤</button>
      </form>
    </main>
  </div>
</body>
</html>
