name: Deploy to AWS S3 and CloudFront

on:
  push:
    branches: [ "tarea-03" ]  # Solo se activa en la rama tarea-03

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Paso 1: Checkout del código
      - name: Checkout repository
        uses: actions/checkout@v4

      # Paso 2: Instalar Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'  # Versión de Node.js (usa la misma que en tu proyecto)

      # Paso 3: Instalar dependencias y construir el proyecto
      - name: Install dependencies and build
        run: |
          npm install
          npm run build  # Comando de Vite para generar la carpeta /dist

      # Paso 4: Configurar credenciales de AWS
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1  # Cambia si tu bucket está en otra región

      # Paso 5: Sincronizar archivos con S3 (elimina archivos obsoletos)
      - name: Upload files to S3
        run: |
          aws s3 sync ./dist s3://${{ secrets.AWS_BUCKET_NAME }} --delete

      # Paso 6: Invalidar caché de CloudFront
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"